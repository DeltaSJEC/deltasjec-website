<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delta Launch Sequence</title>
  <style>
    
    :root {--bg: #03060d;--accent: #ff3b30;--glow: #4fd1ff;--ok: #3dff9a;--text: #d8ecff;}
    * {box-sizing: border-box;margin: 0;padding: 0;}
    html,body {height: 100%;background: var(--bg);color: var(--text);overflow: hidden;font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;}
    canvas#stars {position: fixed;inset: 0;width: 100%;height: 100%;}
    .scanlines {position: fixed;inset: 0;pointer-events: none;z-index: 5;background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);}
    .vignette {position: fixed;inset: 0;pointer-events: none;z-index: 4;background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .75) 100%);}
    #stage {position: fixed;inset: 0;display: flex;align-items: center;justify-content: center;z-index: 2;}
    .screen {position: absolute;inset: 0;display: none;flex-direction: column;align-items: center;justify-content: center;text-align: center;padding: 24px;}
    .screen.active {display: flex;animation: fadeIn .6s ease both;}
    @keyframes fadeIn {from {opacity: 0;}to {opacity: 1;}}
    .eyebrow {letter-spacing: .5em;font-size: clamp(11px, 1.6vw, 15px);color: var(--glow);opacity: .85;margin-bottom: 14px;}
    h1.title {font-size: clamp(26px, 5vw, 54px);letter-spacing: .35em;font-weight: 700;margin-bottom: 44px;text-shadow: 0 0 24px rgba(79, 209, 255, .5);}
    .hint {margin-top: 34px;font-size: 13px;letter-spacing: .3em;color: #7f9bb5;animation: blink 1.6s infinite;}
    @keyframes blink {50% {opacity: .25;}}
    #launchBtn {position: relative;width: clamp(190px, 32vw, 280px);height: clamp(190px, 32vw, 280px);border-radius: 50%;border: 6px solid #2a0d0b;cursor: pointer;color: #fff;font: 700 clamp(20px, 3.4vw, 32px) "Courier New", monospace;letter-spacing: .2em;background: radial-gradient(circle at 35% 30%, #ff7a6e, var(--accent) 45%, #8d0c05 100%);box-shadow: 0 0 0 10px #12171f, 0 0 0 14px #2c3644, 0 0 60px rgba(255, 59, 48, .55), inset 0 -14px 30px rgba(0, 0, 0, .45);animation: pulse 2s ease-in-out infinite;transition: transform .12s;text-shadow: 0 2px 8px rgba(0, 0, 0, .6);}
    #launchBtn:hover {transform: scale(1.04);}
    #launchBtn:active {transform: scale(.94);box-shadow: 0 0 0 10px #12171f, 0 0 0 14px #2c3644, 0 0 30px rgba(255, 59, 48, .9), inset 0 10px 30px rgba(0, 0, 0, .6);}
    @keyframes pulse {50% {box-shadow: 0 0 0 10px #12171f, 0 0 0 14px #2c3644, 0 0 110px rgba(255, 59, 48, .9), inset 0 -14px 30px rgba(0, 0, 0, .45);}}
    .ringwrap {position: relative;width: clamp(240px, 46vw, 400px);height: clamp(240px, 46vw, 400px);}
    .ringwrap svg {width: 100%;height: 100%;transform: rotate(-90deg);}
    .ringwrap circle {fill: none;stroke-width: 6;}
    .ring-bg {stroke: rgba(79, 209, 255, .15);}
    .ring-fg {stroke: var(--glow);stroke-linecap: round;stroke-dasharray: 628.3;stroke-dashoffset: 0;transition: stroke-dashoffset 1s linear, stroke .3s;filter: drop-shadow(0 0 8px var(--glow));}
    .ring-fg.hot {stroke: var(--accent);filter: drop-shadow(0 0 10px var(--accent));}
    #num {position: absolute;inset: 0;display: flex;align-items: center;justify-content: center;font-size: clamp(110px, 22vw, 200px);font-weight: 700;text-shadow: 0 0 30px rgba(79, 209, 255, .7);}
    #num.hot {color: #ffd6d2;text-shadow: 0 0 36px rgba(255, 59, 48, .9);}
    #num.pop {animation: pop .9s ease-out;}
    @keyframes pop {0% {transform: scale(1.25);opacity: .3;}100% {transform: scale(1);opacity: 1;}}
    .tminus {margin-top: 18px;letter-spacing: .5em;font-size: clamp(12px, 1.8vw, 16px);color: var(--glow);}
    #status {margin-top: 12px;height: 24px;letter-spacing: .22em;font-size: clamp(11px, 1.7vw, 15px);color: #ffd36b;}
    .telemetry {position: fixed;bottom: 22px;left: 0;right: 0;display: flex;justify-content: center;gap: clamp(14px, 4vw, 50px);font-size: clamp(10px, 1.5vw, 13px);letter-spacing: .15em;color: #7f9bb5;z-index: 3;}
    .telemetry b {color: var(--text);font-weight: 400;}
    #telemetry {display: none;}
    #blank {background: #000;z-index: 10;}
    .success {font-size: clamp(26px, 6vw, 70px);font-weight: 700;letter-spacing: .25em;color: var(--ok);text-shadow: 0 0 30px rgba(61, 255, 154, .65);}
    .sub {margin-top: 16px;letter-spacing: .4em;font-size: clamp(11px, 1.8vw, 16px);color: #8fb7a3;}
    .loading {margin-top: 48px;font-size: clamp(16px, 2.6vw, 24px);letter-spacing: .4em;color: var(--text);}
    .bar {margin-top: 20px;width: min(420px, 78vw);height: 8px;border: 1px solid #2c4a5e;border-radius: 4px;overflow: hidden;}
    .bar>i {display: block;height: 100%;width: 0;background: linear-gradient(90deg, #1b9bd1, var(--glow));box-shadow: 0 0 14px var(--glow);}
    #flash {position: fixed;inset: 0;background: #fff;opacity: 0;pointer-events: none;z-index: 9;}
    #sound {position: fixed;top: 16px;right: 16px;z-index: 20;background: rgba(10, 18, 30, .7);color: var(--text);border: 1px solid #2c4a5e;border-radius: 6px;padding: 8px 12px;cursor: pointer;font: 12px "Courier New", monospace;letter-spacing: .15em;}
    #sound:hover {border-color: var(--glow);}
    @media (prefers-reduced-motion: reduce) {#launchBtn {animation: none;}.hint {animation: none;}}

  </style>
</head>

<body>
  <canvas id="stars"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div id="flash"></div>
  <button id="sound" type="button" aria-label="Toggle sound">SOUND: ON</button>

  <div id="stage">
    <!-- 1. Start -->
    <section class="screen active" id="start">
      <div class="eyebrow">MISSION CONTROL</div>
      <h1 class="title">DELTA LAUNCH</h1>
      <button id="launchBtn" type="button">LAUNCH</button>
      <div class="hint">PRESS TO INITIATE SEQUENCE</div>
    </section>

    <!-- 2. Countdown -->
    <section class="screen" id="count">
      <div class="ringwrap">
        <svg viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="100" />
          <circle class="ring-fg" id="ring" cx="110" cy="110" r="100" />
        </svg>
        <div id="num">10</div>
      </div>
      <div class="tminus">T-MINUS</div>
      <div id="status">INITIALIZING</div>
    </section>

    <!-- 3. Blank -->
    <section class="screen" id="blank"></section>

    <!-- 4. Success -->
    <section class="screen" id="success">
      <div class="success" id="successText"></div>
      <div class="sub">ALL SYSTEMS NOMINAL</div>
      <div class="loading" id="loadingText" style="visibility:hidden">LOADING<span id="dots"></span></div>
      <div class="bar" id="bar" style="visibility:hidden"><i id="barFill"></i></div>
    </section>
  </div>

  <div class="telemetry" id="telemetry">
    <span>ALT <b id="tAlt">0</b> M</span>
    <span>FUEL <b id="tFuel">100</b>%</span>
    <span>THRUST <b id="tThr">0</b>%</span>
    <span>GUIDANCE <b>LOCKED</b></span>
  </div>

  <script>
    /* ============ CONFIG ============ */
    const DELTA_URL = "https://deltasjec.vercel.app/";   // <-- put the Delta website link here
    const BLANK_SECONDS = 5;       // black screen after zero
    const LOADING_SECONDS = 3;     // "Loading..." duration before redirect
    const USE_VOICE = true;        // spoken countdown (browser text-to-speech)
    /* ================================ */

    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

    /* ---------- Starfield ---------- */
    const cv = $('stars'), g = cv.getContext('2d');
    let W, H, stars = [], warp = 0;
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; stars = Array.from({ length: 260 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 1 + .2 })); }
    addEventListener('resize', resize); resize();
    (function loop() {
      g.fillStyle = `rgba(3,6,13,${warp ? .35 : 1})`; g.fillRect(0, 0, W, H);
      for (const s of stars) {
        s.y += s.z * (.15 + warp * 14);
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        g.fillStyle = `rgba(200,230,255,${.35 + s.z * .4})`;
        g.fillRect(s.x, s.y, s.z * 1.4, s.z * 1.4 + warp * s.z * 22);
      }
      requestAnimationFrame(loop);
    })();

    /* ---------- Audio (synthesized, no files needed) ---------- */
    let ctx, master, soundOn = true, rumble = null;
    function initAudio() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = soundOn ? 0.85 : 0; master.connect(ctx.destination);
      } catch (e) { ctx = null; }
    }
    function noiseBuf(sec) {
      const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return b;
    }
    function beep(freq = 880, dur = .12, vol = .25, type = 'sine') {
      if (!ctx) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + .05);
    }
    function startRumble() {
      if (!ctx || rumble) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf(3); src.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 90;
      const gn = ctx.createGain(); gn.gain.value = 0;
      src.connect(lp); lp.connect(gn); gn.connect(master); src.start();
      rumble = { src, lp, gn };
    }
    function rumbleTo(vol, freq, secs = 1) {
      if (!rumble) return; const t = ctx.currentTime;
      rumble.gn.gain.linearRampToValueAtTime(vol, t + secs);
      rumble.lp.frequency.linearRampToValueAtTime(freq, t + secs);
    }
    function roar() {
      if (!ctx) return; const t = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf(5);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .7;
      bp.frequency.setValueAtTime(200, t); bp.frequency.exponentialRampToValueAtTime(1400, t + 1.2);
      const gn = ctx.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(1, t + .25);
      gn.gain.exponentialRampToValueAtTime(.001, t + 4.5);
      src.connect(bp); bp.connect(gn); gn.connect(master); src.start(t);
      rumbleTo(.9, 260, .3);
      const sub = ctx.createOscillator(), sg = ctx.createGain(); sub.type = 'sawtooth';
      sub.frequency.setValueAtTime(40, t); sub.frequency.exponentialRampToValueAtTime(70, t + 2);
      sg.gain.setValueAtTime(.0001, t); sg.gain.linearRampToValueAtTime(.4, t + .3); sg.gain.exponentialRampToValueAtTime(.001, t + 4);
      sub.connect(sg); sg.connect(master); sub.start(t); sub.stop(t + 4.2);
    }
    function fadeAll(secs = .8) {
      if (!ctx) return; const t = ctx.currentTime;
      if (rumble) { rumble.gn.gain.cancelScheduledValues(t); rumble.gn.gain.setValueAtTime(rumble.gn.gain.value, t); rumble.gn.gain.linearRampToValueAtTime(0, t + secs); const r = rumble; setTimeout(() => { try { r.src.stop(); } catch (e) { } }, secs * 1000 + 100); rumble = null; }
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + secs);
    }
    function restoreMaster() { if (ctx) { const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(soundOn ? .85 : 0, t + .3); } }
    function chime() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => beep(f, .9, .22, 'triangle'), i * 140)); }
    function radioClick() { beep(1800, .03, .08, 'square'); setTimeout(() => beep(1400, .03, .06, 'square'), 60); }
    function speak(text) {
      if (!USE_VOICE || !soundOn || !('speechSynthesis' in window)) return;
      try { const u = new SpeechSynthesisUtterance(text); u.rate = .95; u.pitch = .7; u.volume = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { }
    }

    $('sound').addEventListener('click', () => {
      soundOn = !soundOn; $('sound').textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
      if (ctx) master.gain.value = soundOn ? .85 : 0;
      if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
    });

    /* ---------- Sequence ---------- */
    const STATUS = {
      10: 'GUIDANCE INTERNAL', 9: 'FUEL PRESSURIZATION', 8: 'RANGE SAFETY CONFIRMED', 7: 'FLIGHT COMPUTER ARMED',
      6: 'MAIN ENGINE START', 5: 'IGNITION SEQUENCE START', 4: 'THRUST BUILD-UP', 3: 'ALL SYSTEMS GO',
      2: 'ABORT SYSTEM ARMED', 1: 'LIFT-OFF COMMIT', 0: 'LIFTOFF'
    };
    const ring = $('ring'), num = $('num'), CIRC = 628.3;
    const stage = $('stage');

    function shake(level) {
      if (level <= 0) { stage.style.transform = ''; return; }
      const p = level * 6;
      stage.style.transform = `translate(${(Math.random() - .5) * p}px, ${(Math.random() - .5) * p}px)`;
    }
    let shakeLevel = 0, shakeTimer;

    async function runSequence() {
      initAudio();
      if (ctx && ctx.state === 'suspended') await ctx.resume();
      restoreMaster();
      radioClick();
      show('count');
      $('telemetry').style.display = 'flex';
      shakeTimer = setInterval(() => shake(shakeLevel), 40);
      const t0 = performance.now();

      for (let n = 10; n >= 0; n--) {
        num.textContent = n;
        num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
        $('status').textContent = STATUS[n];
        ring.style.transition = 'none'; ring.style.strokeDashoffset = CIRC * (1 - n / 10);
        void ring.getBoundingClientRect();
        ring.style.transition = 'stroke-dashoffset 1s linear';
        ring.style.strokeDashoffset = CIRC * (1 - Math.max(n - 1, 0) / 10);

        const hot = n <= 5;
        num.classList.toggle('hot', hot); ring.classList.toggle('hot', hot);
        $('tFuel').textContent = Math.max(100 - Math.round((10 - n) * .6), 90);
        $('tThr').textContent = Math.min(Math.round(Math.max(0, 7 - n) * 16), 100);

        if (n > 0) { beep(n <= 3 ? 1200 : 880, .14, .28); speak(String(n)); }
        if (n === 6) { startRumble(); rumbleTo(.25, 110, 1.5); }
        if (n === 5) rumbleTo(.4, 140, 1);
        if (n === 4) { rumbleTo(.55, 170, 1); shakeLevel = .3; warp = .02; }
        if (n === 3) { rumbleTo(.7, 200, 1); shakeLevel = .6; }
        if (n === 2) { rumbleTo(.85, 230, 1); shakeLevel = 1; }
        if (n === 1) { rumbleTo(1, 260, 1); shakeLevel = 1.6; }
        if (n === 7) radioClick();

        if (n === 0) {
          speak('Liftoff');
          roar();
          beep(1500, .5, .35, 'square');
          shakeLevel = 3.5; warp = 1;
          $('flash').style.transition = 'none'; $('flash').style.opacity = .95;
          void $('flash').offsetWidth;
          $('flash').style.transition = 'opacity 1.4s ease-out'; $('flash').style.opacity = 0;
          let alt = 0; const altT = setInterval(() => { alt += Math.round(40 + alt * .18); $('tAlt').textContent = alt.toLocaleString(); }, 80);
          await sleep(1700);
          clearInterval(altT);
          break;
        }
        // Keep time aligned so each number lands exactly 1s apart
        const next = t0 + (11 - n) * 1000;
        await sleep(Math.max(0, next - performance.now()));
      }

      /* Blank screen */
      clearInterval(shakeTimer); shake(0); warp = 0; $('telemetry').style.display = 'none';
      show('blank');
      fadeAll(.8);
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      await sleep(BLANK_SECONDS * 1000);

      /* Launch successful */
      restoreMaster();
      show('success');
      chime();
      speak('Launch successful');
      const msg = 'LAUNCH SUCCESSFUL', out = $('successText');
      for (let i = 1; i <= msg.length; i++) { out.textContent = msg.slice(0, i); if (msg[i - 1] !== ' ') beep(2200, .025, .05, 'square'); await sleep(70); }
      await sleep(1400);

      /* Loading */
      $('loadingText').style.visibility = 'visible'; $('bar').style.visibility = 'visible';
      let d = 0; const dotT = setInterval(() => { d = (d + 1) % 4; $('dots').textContent = '.'.repeat(d); }, 350);
      const fill = $('barFill'); fill.style.transition = `width ${LOADING_SECONDS}s linear`; void fill.offsetWidth; fill.style.width = '100%';
      await sleep(LOADING_SECONDS * 1000);
      clearInterval(dotT); $('dots').textContent = '...';
      await sleep(250);

      /* Redirect to Delta website */
      redirect();
    }

    function redirect() {
      // If this page is inside an iframe, try to navigate the parent; fall back to this window.
      try { if (window.top !== window.self) { window.top.location.href = DELTA_URL; return; } } catch (e) { }
      window.location.href = DELTA_URL;
    }

    let started = false;
    $('launchBtn').addEventListener('click', () => { if (started) return; started = true; runSequence(); });
  </script>
</body>

</html>
